<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 230px;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2a;
      color: #d0d0e8;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    header svg { flex-shrink: 0; }
    h1 {
      font-size: 13px;
      font-weight: 600;
      color: #c0c0e0;
      letter-spacing: 0.2px;
    }

    #status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      min-height: 18px;
      color: #888;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }
    .dot.live   { background: #34d399; }
    .dot.muted  { background: #f87171; }
    .dot.off    { background: #444; }

    #pip-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    #pip-btn:hover:not(:disabled)  { background: #4338ca; }
    #pip-btn:disabled {
      background: #2a2a3d;
      color: #555;
      cursor: default;
    }

    #error-msg {
      margin-top: 10px;
      font-size: 11px;
      color: #f87171;
      display: none;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <!-- Simple Teams-ish icon -->
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6264A7"/>
          <stop offset="100%" stop-color="#4B4EAF"/>
        </linearGradient>
      </defs>
      <rect width="18" height="18" rx="4" fill="url(#tg)"/>
      <!-- T bar -->
      <rect x="2.5" y="4" width="13" height="3" rx="0.5" fill="white"/>
      <!-- T stem -->
      <rect x="7.5" y="7" width="3" height="7" rx="0.5" fill="white"/>
    </svg>
    <h1>Teams PiP Controls</h1>
  </header>

  <div id="status-row">
    <span class="dot" id="dot"></span>
    <span id="status-text">Checking…</span>
  </div>

  <button id="pip-btn" disabled>Open floating controls</button>
  <div id="error-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
