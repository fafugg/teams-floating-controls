<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2a;
      color: #d0d0e8;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    header svg { flex-shrink: 0; }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #c0c0e0;
    }

    .setting {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }
    input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2a2a3d;
      background: #111120;
      color: #d0d0e8;
      font-size: 12px;
      font-family: inherit;
    }
    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: #4f46e5;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-row input[type="checkbox"] {
      accent-color: #4f46e5;
    }
    .checkbox-row span {
      font-size: 12px;
      color: #d0d0e8;
    }

    #save {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      margin-top: 8px;
    }
    #save:hover { background: #4338ca; }

    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #34d399;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6264A7"/>
          <stop offset="100%" stop-color="#4B4EAF"/>
        </linearGradient>
      </defs>
      <rect width="18" height="18" rx="4" fill="url(#tg)"/>
      <rect x="2.5" y="4" width="13" height="3" rx="0.5" fill="white"/>
      <rect x="7.5" y="7" width="3" height="7" rx="0.5" fill="white"/>
    </svg>
    <h1>Teams PiP Settings</h1>
  </header>

  <div class="setting">
    <label for="pip-width">PiP Window Width (px)</label>
    <input type="number" id="pip-width" min="200" max="800" step="10" value="360">
  </div>

  <div class="setting">
    <label for="pip-height">PiP Window Height (px)</label>
    <input type="number" id="pip-height" min="150" max="600" step="10" value="290">
  </div>

  <div class="setting">
    <label for="default-view">Default View</label>
    <select id="default-view">
      <option value="auto">Auto (follow meeting state)</option>
      <option value="participants">Camera</option>
      <option value="content">Screen share</option>
      <option value="list">Participants list</option>
    </select>
  </div>

  <div class="setting">
    <div class="checkbox-row">
      <input type="checkbox" id="auto-open">
      <span>Auto-open PiP when joining a call</span>
    </div>
  </div>

  <button id="save">Save settings</button>
  <div id="status">Settings saved</div>

  <script src="options.js"></script>
</body>
</html>
